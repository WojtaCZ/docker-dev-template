name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild. This is what keeps the chain fresh: there is no
  # cross-repo dispatch any more, and a rebuild also picks up Arch package
  # updates, which a change-triggered build would never do on its own.
  # Staggered so a parent finishes before its children start (template 03:00, base 04:00, leaves 05:00 UTC Mondays).
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build into the local daemon first so the smoke test runs BEFORE anything
      # is published. Nothing reaches GHCR unless dev-doctor passes.
      - name: Build (local, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dev-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh tests/*.sh
          jq -e . claude-baseline/settings.json > /dev/null
          echo "shell + JSON assets OK"

      - name: Smoke test
        run: |
          docker run --rm -e DEV_SKIP_UPDATE=1 \
            -v "$PWD/tests:/tests:ro" \
            dev-template:ci bash /tests/smoke.sh

      - name: Smoke test — UID remap path
        run: |
          docker run --rm --user 0:0 -e DEV_SKIP_UPDATE=1 \
            -e HOST_UID=1234 -e HOST_GID=1234 \
            dev-template:ci id | tee /dev/stderr | grep -q 'uid=1234'

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max