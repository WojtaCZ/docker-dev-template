name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fan out to downstream images so they rebuild against the fresh base layer.
      # Requires DOWNSTREAM_DISPATCH_PAT secret (fine-grained PAT, Contents:Write
      # on docker-dev-embedded-base and docker-dev-embedded-telink).
      - name: Notify embedded-base
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: gh api repos/wojtacz/docker-dev-embedded-base/dispatches -f event_type=base-image-updated
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}

      - name: Notify telink leaf (direct — does not go through embedded-base)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: gh api repos/WojtaCZ/-docker-dev-embedded-telink/dispatches -f event_type=template-image-updated
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}
