name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build into the local daemon first so the smoke test runs BEFORE anything
      # is published. Nothing reaches GHCR unless dev-doctor passes.
      - name: Build (local, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dev-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh tests/*.sh
          jq -e . claude-baseline/settings.json > /dev/null
          echo "shell + JSON assets OK"

      - name: Smoke test
        run: |
          docker run --rm -e DEV_SKIP_UPDATE=1 \
            -v "$PWD/tests:/tests:ro" \
            dev-template:ci bash /tests/smoke.sh

      - name: Smoke test — UID remap path
        run: |
          docker run --rm --user 0:0 -e DEV_SKIP_UPDATE=1 \
            -e HOST_UID=1234 -e HOST_GID=1234 \
            dev-template:ci id | tee /dev/stderr | grep -q 'uid=1234'

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is already published by this point, so a failed fan-out must
      # not fail the run: it means downstream images rebuild late, not that this
      # one is bad. Each dispatch is independent and warns for itself.
      - name: Notify downstream images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}
        run: |
          # embedded-base fans out further to arm + wch on its own; the other two
          # inherit from this image directly.
          for repo in docker-dev-embedded-base docker-dev-embedded-telink docker-dev-web; do
            if [ "$repo" = "docker-dev-embedded-base" ]; then
              ev=base-image-updated
            else
              ev=template-image-updated
            fi
            if gh api "repos/WojtaCZ/$repo/dispatches" -f event_type="$ev" >/dev/null; then
              echo "dispatched $ev -> $repo"
            else
              echo "::warning::could not dispatch $ev to $repo -- DOWNSTREAM_DISPATCH_PAT may lack access to it"
            fi
          done
